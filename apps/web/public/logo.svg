<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200" fill="none">
  <!-- Aglotrends official logo: icon + wordmark + tagline -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#2f7bf6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="logoGradRev" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2f7bf6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Icon: stylized ribbon "A" -->
  <g transform="translate(20, 20)">
    <path
      d="M 44 132 C 44 132 44 72 78 72 C 112 72 112 132 112 132 L 112 132 L 78 132 Z"
      fill="url(#logoGrad)"
      filter="url(#logoShadow)"
    />
    <path
      d="M 112 132 L 156 132 C 156 132 156 72 122 72 C 88 72 88 132 88 132 L 88 132 L 112 132 Z"
      fill="url(#logoGradRev)"
      filter="url(#logoShadow)"
    />
    <path
      d="M 78 100 C 78 100 78 132 122 132 C 166 132 166 100 166 100 L 166 100 L 122 100 Z"
      fill="url(#logoGrad)"
      filter="url(#logoShadow)"
    />
    <path
      d="M 78 132 C 78 132 78 118 100 118 C 122 118 122 132 122 132 L 122 132 L 78 132 Z"
      fill="url(#logoGradRev)"
      filter="url(#logoShadow)"
    />
  </g>

  <!-- Wordmark: AGLOTRENDS -->
  <text x="160" y="105" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="#ffffff">AGLO</text>
  <text x="310" y="105" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-2" fill="url(#logoGrad)">TRENDS</text>

  <!-- Tagline -->
  <text x="160" y="145" font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#8aa0b5" text-anchor="start">I N T E L L I G E N C E   •   M A R K E T   •   C O M M U N I T Y</text>
</svg>
